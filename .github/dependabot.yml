# Weekly dependency updates (docs/QA.md, "Security scans"). Minor and patch bumps come as one
# grouped PR per ecosystem; major bumps come one PR each, because they can break the build.
# Security updates (Dependabot alerts) are opened as soon as an advisory appears.
version: 2
updates:
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    groups:
      pub-minor:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /app/android
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    groups:
      gradle-minor:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    groups:
      pip-minor:
        update-types: [minor, patch]

  # CI-only tools (zizmor), installed by hash in security.yml.
  - package-ecosystem: pip
    directory: /.github/tools
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Singapore
    groups:
      ci-tools:
        update-types: [minor, patch]

  # The web layout check (playwright-core only), run by web.yml.
  - package-ecosystem: npm
    directory: /web/tests/e2e
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Singapore
    # A new npm release waits a week before it is proposed (time for a bad publish to be pulled).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types: [minor, patch]

  # Keeps the commit SHAs in every `uses:` current; the `# vX.Y.Z` comment is updated too.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    groups:
      actions-minor:
        update-types: [minor, patch]
