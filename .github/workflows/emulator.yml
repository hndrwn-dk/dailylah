name: emulator
# On-device regression tests (docs/QA.md): app flows, real notifications and widget,
# permission handling, and the APK-over-APK upgrade. Free on this public repo because it
# uses standard GitHub-hosted runners.
on:
  pull_request:
    paths: ["app/**", "scripts/emulator_*.sh", ".github/workflows/emulator.yml"]
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Previous version for the upgrade test (branch, tag or SHA)"
        default: "origin/main"
  # Called by the app workflow before uploading to Google Play.
  workflow_call:
    inputs:
      base_ref:
        description: "Previous version for the upgrade test (branch, tag or SHA)"
        type: string
        default: "origin/main"
# Read-only: builds and runs APKs on emulators, writes nothing back.
permissions:
  contents: read
concurrency:
  # github.workflow is "app" when called from the app workflow, so a release check on main
  # never cancels (or is cancelled by) a pull request run.
  group: emulator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flows:
    name: flows (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest supported Android (minSdk 29 = Android 10). The job warns if the APK's minSdk differs.
          - api: 29
            target: google_apis
            arch: x86_64
            min: true
          # Android 15, still the most common recent version.
          - api: 35
            target: google_apis
            arch: x86_64
            min: false
          # Android 16 = the targetSdk Google Play requires from 31 Aug 2026.
          - api: 36
            target: google_apis
            arch: x86_64
            min: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - name: Run flows on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          EXPECT_MIN_API: ${{ matrix.min }}
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/emulator_flows.sh

  upgrade:
    name: upgrade (previous version → this build)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Upgrade on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          BASE_REF: ${{ inputs.base_ref || 'origin/main' }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/emulator_upgrade.sh

  release:
    name: release build (R8) starts and runs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - name: Start the release build on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/emulator_release.sh
