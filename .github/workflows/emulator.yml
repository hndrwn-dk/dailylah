name: emulator
# On-device regression tests (docs/QA.md): app flows, real notifications and widget,
# permission handling, and the APK-over-APK upgrade. Free on this public repo because it
# uses standard GitHub-hosted runners.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Previous version for the upgrade test (branch, tag or SHA)"
        default: "origin/main"
  # Called by the app workflow before uploading to Google Play.
  workflow_call:
    inputs:
      base_ref:
        description: "Previous version for the upgrade test (branch, tag or SHA)"
        type: string
        default: "origin/main"
      aab_artifact:
        description: "Artifact (in this run) holding dailylah.aab; the Maestro job then tests the APK made from it"
        type: string
        default: ""
# Read-only: builds and runs APKs on emulators, writes nothing back.
permissions:
  contents: read
concurrency:
  # github.workflow is "app" when called from the app workflow, so a release check on main
  # never cancels (or is cancelled by) a pull request run.
  group: emulator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Pull requests run this workflow every time, so the "emulator result" check below always
  # reports and can be a required check in the main ruleset (docs/QA.md "Required checks").
  # Called from the app workflow (push or manual run), it always runs every job.
  changes:
    name: what changed (emulator)
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      # The PR merge commit's first parent is the base branch, so two commits are enough.
      # --no-renames lists both paths of a moved file (a move out of app/ still counts).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: .github
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only --no-renames HEAD^1 HEAD)
            printf 'Changed files:\n%s\n' "$files"
            grep -qE '^(app/|scripts/emulator_[^/]*\.sh$|\.github/workflows/emulator\.yml$)' <<<"$files" || run=false
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  flows:
    name: flows (API ${{ matrix.api }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest supported Android (minSdk 29 = Android 10). The job warns if the APK's minSdk differs.
          - api: 29
            target: google_apis
            arch: x86_64
            min: true
          # Android 15, still the most common recent version.
          - api: 35
            target: google_apis
            arch: x86_64
            min: false
          # Android 16 = the targetSdk Google Play requires from 31 Aug 2026.
          - api: 36
            target: google_apis
            arch: x86_64
            min: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - name: Run flows on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          EXPECT_MIN_API: ${{ matrix.min }}
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/emulator_flows.sh

  upgrade:
    name: upgrade (previous version → this build)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Upgrade on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          BASE_REF: ${{ inputs.base_ref || 'origin/main' }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/emulator_upgrade.sh

  release:
    name: release build (R8) starts and runs
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - name: Start the release build on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/emulator_release.sh

  maestro:
    name: Maestro flows (release APK)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAESTRO_VERSION: "2.12.1"
      MAESTRO_SHA256: 54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7
      BUNDLETOOL_VERSION: "1.18.3"
      BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
      AAB_ARTIFACT: ${{ inputs.aab_artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      # Release (called by the app workflow): test the exact App Bundle that goes to Google Play.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.aab_artifact != ''
        with:
          name: ${{ inputs.aab_artifact }}
          path: ${{ runner.temp }}/aab
      # Pull request: build the R8 release APK from this commit (no upload key here).
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: inputs.aab_artifact == ''
        with:
          channel: stable
          cache: true
      - name: Build the release APK
        if: inputs.aab_artifact == ''
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release
      - name: Install Maestro and bundletool (pinned by checksum)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -
      - name: Run the Maestro flows on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/emulator_maestro.sh
      # Kept when an attempt failed, also when the retry passed (the script removes a clean run).
      - name: Keep screenshots, videos, reports and logs of a failed attempt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-results
          path: ${{ runner.temp }}/maestro-out/attempt-*
          if-no-files-found: ignore
          retention-days: 14

  # The one check to require for this workflow: fails if any job failed or was cancelled,
  # passes when they passed or were skipped (no emulator change).
  result:
    name: emulator result
    needs: [changes, flows, upgrade, release, maestro]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "::error::A job in the emulator workflow failed or was cancelled."; exit 1 ;;
          esac
