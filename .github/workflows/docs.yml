name: docs
# Agent docs stay in step with the code (CLAUDE.md, "Where the rules live"):
#   - docs/REPO_MAP.md matches app/lib (files, public types and functions, providers) and the
#     backend endpoints;
#   - every AGENTS.md matches the CLAUDE.md in the same folder.
# Fix with `python3 scripts/repo_map.py` and commit the result.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  repo-map:
    name: repo map and AGENTS.md up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 scripts/repo_map.py --check
