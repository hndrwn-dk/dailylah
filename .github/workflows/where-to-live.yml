name: where-to-live
# Rebuilds web/data/where-to-live.json (HDB median rent and resale per town + OneMap transit
# times to office areas) once a week and pushes it to main only when its data changed (push job,
# deploy key in environment data-push, scripts/push_data.sh).
# Vercel redeploys web/ on push. backend/data/where_to_live_routes.json caches the routes
# (asked again after 30 days). Secrets: ONEMAP_EMAIL, ONEMAP_PASSWORD; DATAGOV_API_KEY optional.
# docs/WHERE_TO_LIVE.md
on:
  schedule:
    - cron: "41 19 * * 0" # Monday 03:41 SGT
  workflow_dispatch:
permissions: {}
concurrency:
  group: where-to-live
  cancel-in-progress: false
jobs:
  build:
    name: where-to-live (build)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Builds the file and hands any change to the push job as a patch. No write access here:
    # this job runs pip and the build's third-party code.
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Build
        working-directory: backend
        env:
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}
          ONEMAP_EMAIL: ${{ secrets.ONEMAP_EMAIL }}
          ONEMAP_PASSWORD: ${{ secrets.ONEMAP_PASSWORD }}
        run: python -m app.where_to_live ../web/data
      - name: Collect changes
        id: diff
        run: |
          # Stage first: plain `git diff` ignores new (untracked) files.
          git add web/data/where-to-live.json backend/data/where_to_live_routes.json
          if git diff --cached --quiet; then
            echo "No data changes"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git diff --cached --binary --full-index > "$RUNNER_TEMP/data.patch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: where-to-live-patch
          path: ${{ runner.temp }}/data.patch
          retention-days: 3

  # Pushes the patch to main with the deploy key that the main ruleset lets bypass its rules
  # (docs/HANDOFF.md, "Rulesets", route B). Environment data-push holds DATA_PUSH_SSH_KEY and is
  # limited to main. Only GitHub's own actions and scripts/push_data.sh run in this job.
  push:
    name: where-to-live (push)
    needs: build
    if: needs.build.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: data-push
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: where-to-live-patch
          path: ${{ runner.temp }}/patch
      - name: Push to main
        env:
          DATA_PUSH_SSH_KEY: ${{ secrets.DATA_PUSH_SSH_KEY }}
          PATCH: ${{ runner.temp }}/patch/data.patch
        run: |
          bash scripts/push_data.sh "$PATCH" "Update where-to-live data" \
            web/data/where-to-live.json backend/data/where_to_live_routes.json
