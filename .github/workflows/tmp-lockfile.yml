name: tmp-lockfile
# Temporary (Phase 1): makes app/pubspec.lock with the same Flutter stable as CI. Removed in the
# next commit. The lockfile is printed to the log.
on:
  push:
    branches: [security/phase1-deterministic-scan]
    paths: [".github/workflows/tmp-lockfile.yml"]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: false
      - run: |
          flutter --version && flutter pub get
          echo '<<<LOCK'; cat pubspec.lock; echo 'LOCK>>>'; sha256sum pubspec.lock
        working-directory: app
