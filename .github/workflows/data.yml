name: data
# Rebuilds static bundles in web/data/ once a day and commits them if they changed.
# Vercel redeploys web/ on push. Needs repo secrets LTA_ACCOUNT_KEY, ONEMAP_EMAIL and
# ONEMAP_PASSWORD (OneMap geocoding and themes); DATAGOV_API_KEY is optional. GEOAPIFY_API_KEY
# (Geoapify Places, OpenStreetMap toilets for toilets.json): without it the previous file stays.
# backend/data/geocode.json caches OneMap lookups between runs.
on:
  schedule:
    - cron: "17 20 * * *" # 04:17 SGT
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/data.yml"
      - "scripts/push_data.sh"
      - "backend/app/build_static.py"
      - "backend/app/sources.py"
      - "backend/app/bundles.py"
      - "backend/app/datagov.py"
      - "backend/app/geoapify.py"
permissions: {}
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    # Builds the bundles and hands any change to the push job as a patch. No write access here:
    # this job runs pip and the build's third-party code.
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    # The first run geocodes ~13,000 HDB blocks through OneMap (cached afterwards).
    timeout-minutes: 120
    steps:
      # On main, build from the newest main, not from the commit the run was queued at: a run that
      # waited in the `data` concurrency group would otherwise build a patch on top of bundles an
      # earlier run already replaced, and push_data.sh would refuse it (data run #61, 8 Nov 2026).
      # The workflow file (secrets, allowlist) still comes from the queued commit: a run queued
      # before a merge that changes the build's outputs or the allowlist may fail once (closed);
      # run it again. A run on another branch builds that branch (its push job is skipped).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || github.sha }}
          persist-credentials: false
      - name: Show what is built
        run: |
          echo "Built from $(git rev-parse HEAD) (run queued at $GITHUB_SHA)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Build bundles
        working-directory: backend
        env:
          LTA_ACCOUNT_KEY: ${{ secrets.LTA_ACCOUNT_KEY }}
          # Optional: raises data.gov.sg rate limits so the build finishes faster. Keys expire;
          # a rejected key falls back to no key and the last step below turns the run red.
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}
          ONEMAP_EMAIL: ${{ secrets.ONEMAP_EMAIL }}
          ONEMAP_PASSWORD: ${{ secrets.ONEMAP_PASSWORD }}
          URA_ACCESS_KEY: ${{ secrets.URA_ACCESS_KEY }}
          EVENTFINDA_USER: ${{ secrets.EVENTFINDA_USER }}
          EVENTFINDA_PASSWORD: ${{ secrets.EVENTFINDA_PASSWORD }}
          # toilets.json. Geoapify takes the key in the URL: build_toilets never prints the URL
          # and httpx's request log line is redacted (apiKey=***, app/geoapify.py).
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: python -m app.build_static ../web/data
      - name: Collect changes
        id: diff
        run: |
          # Stage first: plain `git diff` ignores new (untracked) files.
          git add web/data backend/data
          if git diff --cached --quiet -- web/data backend/data; then
            echo "No data changes"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git diff --cached --binary --full-index -- web/data backend/data > "$RUNNER_TEMP/data.patch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-patch
          path: ${{ runner.temp }}/data.patch
          retention-days: 3
      # Runs after the patch is collected, so fresh bundles are published either way.
      - name: Check data.gov.sg key
        run: |
          python - <<'PY'
          import json, sys
          try:
              report = json.load(open("backend/data/build_report.json"))
          except (OSError, ValueError):
              sys.exit(0)
          if report.get("datagov_key_rejected"):
              print("::error::DATAGOV_API_KEY was rejected by data.gov.sg (expired?). "
                    "The build ran without it. Generate a new key and update the GitHub "
                    "secret DATAGOV_API_KEY and the Render env var.")
              sys.exit(1)
          PY

  # Pushes the patch to main with the deploy key that the main ruleset lets bypass its rules
  # (docs/HANDOFF.md, "Rulesets", route B). Environment data-push holds DATA_PUSH_SSH_KEY and is
  # limited to main. Only GitHub's own actions and scripts/push_data.sh (with the runner's python3,
  # stdlib only, for its JSON check) run in this job.
  push:
    needs: build
    # Also when only the last build step (the data.gov.sg key check) failed: the bundles are
    # published either way, as before.
    if: ${{ !cancelled() && needs.build.outputs.changed == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: data-push
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: data-patch
          path: ${{ runner.temp }}/patch
      - name: Push to main
        env:
          DATA_PUSH_SSH_KEY: ${{ secrets.DATA_PUSH_SSH_KEY }}
          PATCH: ${{ runner.temp }}/patch/data.patch
        run: bash scripts/push_data.sh "$PATCH" "Update static data bundles" 'web/data/*.json' 'backend/data/*.json'
