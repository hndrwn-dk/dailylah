name: data
# Rebuilds static bundles in web/data/ once a day and commits them if they changed.
# Vercel redeploys web/ on push. Needs repo secret LTA_ACCOUNT_KEY.
on:
  schedule:
    - cron: "17 20 * * *" # 04:17 SGT
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Build bundles
        working-directory: backend
        env:
          LTA_ACCOUNT_KEY: ${{ secrets.LTA_ACCOUNT_KEY }}
        run: python -m app.build_static ../web/data
      - name: Commit if changed
        run: |
          if git diff --quiet -- web/data; then
            echo "No data changes"; exit 0
          fi
          git config user.name "dailylah-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          git commit -m "Update static data bundles"
          git push
