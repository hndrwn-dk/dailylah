name: data
# Rebuilds static bundles in web/data/ once a day and commits them if they changed.
# Vercel redeploys web/ on push. Needs repo secrets LTA_ACCOUNT_KEY, ONEMAP_EMAIL and
# ONEMAP_PASSWORD (OneMap geocoding and themes); DATAGOV_API_KEY is optional.
# backend/data/geocode.json caches OneMap lookups between runs.
on:
  schedule:
    - cron: "17 20 * * *" # 04:17 SGT
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/data.yml"
      - "backend/app/build_static.py"
      - "backend/app/sources.py"
      - "backend/app/bundles.py"
      - "backend/app/datagov.py"
permissions: {}
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    # Commits the rebuilt bundles to main.
    permissions:
      contents: write
    # The first run geocodes ~13,000 HDB blocks through OneMap (cached afterwards).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is passed only to the push below, never stored in .git/config.
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Build bundles
        working-directory: backend
        env:
          LTA_ACCOUNT_KEY: ${{ secrets.LTA_ACCOUNT_KEY }}
          # Optional: raises data.gov.sg rate limits so the build finishes faster. Keys expire;
          # a rejected key falls back to no key and the last step below turns the run red.
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}
          ONEMAP_EMAIL: ${{ secrets.ONEMAP_EMAIL }}
          ONEMAP_PASSWORD: ${{ secrets.ONEMAP_PASSWORD }}
          URA_ACCESS_KEY: ${{ secrets.URA_ACCESS_KEY }}
          EVENTFINDA_USER: ${{ secrets.EVENTFINDA_USER }}
          EVENTFINDA_PASSWORD: ${{ secrets.EVENTFINDA_PASSWORD }}
        run: python -m app.build_static ../web/data
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Stage first: plain `git diff` ignores new (untracked) files.
          git add web/data backend/data
          if git diff --cached --quiet -- web/data backend/data; then
            echo "No data changes"; exit 0
          fi
          git config user.name "dailylah-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update static data bundles"
          # Push with the job token in a one-off header (checkout does not persist it).
          b64=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$b64"
          auth="AUTHORIZATION: basic $b64"
          # main may have moved while the build ran (it can take ~40 min).
          for i in 1 2 3; do
            git -c http.extraheader="$auth" pull --rebase origin main \
              && git -c http.extraheader="$auth" push && exit 0
            sleep 10
          done
          exit 1
      # Runs after the commit, so fresh bundles are published either way.
      - name: Check data.gov.sg key
        run: |
          python - <<'PY'
          import json, sys
          try:
              report = json.load(open("backend/data/build_report.json"))
          except (OSError, ValueError):
              sys.exit(0)
          if report.get("datagov_key_rejected"):
              print("::error::DATAGOV_API_KEY was rejected by data.gov.sg (expired?). "
                    "The build ran without it. Generate a new key and update the GitHub "
                    "secret DATAGOV_API_KEY and the Render env var.")
              sys.exit(1)
          PY
