name: app
on:
  push:
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**"]
jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - name: Check app id is com.tursinalabs.dailylah
        working-directory: .
        run: ./scripts/check-app-id.sh
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: flutter analyze
        # Issues are also emitted as annotations so they show up on the commit.
        run: |
          set -o pipefail
          dart analyze --format=machine 2>&1 \
            | awk -F'|' 'NF>=8 {printf "::error file=app/%s,line=%s,col=%s::%s %s: %s\n", substr($4, index($4, "/lib/") ? index($4, "/lib/")+1 : index($4, "/test/")+1), $5, $6, $1, $3, $8}' || true
          flutter analyze
      - name: flutter test
        run: |
          set -o pipefail
          flutter test --reporter=expanded 2>&1 | tee test.log || {
            grep -E "^\s*(Expected|Actual|Which|══|Error|.*\.dart [0-9]+:[0-9]+)" test.log | head -40 \
              | sed 's/^/::error::/' ; exit 1; }
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Build APK (release when the signing key is set, else debug)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Same key every build, so a new APK installs over the old one.
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
            flutter build apk --release --build-number=${GITHUB_RUN_NUMBER} \
              --dart-define=APP_VERSION=0.2.0-${GITHUB_SHA::7}
            cp build/app/outputs/flutter-apk/app-release.apk build/dailylah.apk
            rm -f "$RUNNER_TEMP/upload.jks"
          else
            flutter build apk --debug --build-number=${GITHUB_RUN_NUMBER} \
              --dart-define=APP_VERSION=0.2.0-${GITHUB_SHA::7}
            cp build/app/outputs/flutter-apk/app-debug.apk build/dailylah.apk
          fi
      - name: Upload APK for testing on a phone
        uses: actions/upload-artifact@v7
        with:
          name: dailylah-apk
          path: app/build/dailylah.apk
          retention-days: 14
