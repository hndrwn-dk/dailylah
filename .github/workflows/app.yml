name: app
on:
  push:
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**"]
  workflow_dispatch:
    inputs:
      play_track:
        description: "Upload the signed AAB to this Google Play track (none = build only)"
        type: choice
        default: alpha
        options: [none, internal, alpha, beta, production]
jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      # Every push to main goes to closed testing (alpha) automatically; a manual run can pick
      # another track. Pull requests and other branches only build.
      PLAY_TRACK: ${{ github.event_name == 'workflow_dispatch' && inputs.play_track || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'alpha') || 'none' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - name: Check app id is com.tursinalabs.dailylah
        working-directory: .
        run: ./scripts/check-app-id.sh
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: flutter analyze
        # Issues are also emitted as annotations so they show up on the commit.
        run: |
          set -o pipefail
          dart analyze --format=machine 2>&1 \
            | awk -F'|' 'NF>=8 {printf "::error file=app/%s,line=%s,col=%s::%s %s: %s\n", substr($4, index($4, "/lib/") ? index($4, "/lib/")+1 : index($4, "/test/")+1), $5, $6, $1, $3, $8}' || true
          flutter analyze
      - name: flutter test
        run: |
          set -o pipefail
          flutter test --reporter=expanded --file-reporter=json:test.json 2>&1 | tee test.log || {
            # One annotation listing every failed test with its first error line.
            python3 ../scripts/test_failures.py test.json ; exit 1; }
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Build APK (release when the signing key is set, else debug)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # versionName from pubspec.yaml (one place to bump); versionCode is the run number.
          APP_VERSION=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)
          # Same key every build, so a new APK installs over the old one.
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
            flutter build apk --release --build-number=${GITHUB_RUN_NUMBER} \
              --dart-define=APP_VERSION=$APP_VERSION --dart-define=GIT_SHA=${GITHUB_SHA::7} --dart-define=BUILD_NUMBER=${GITHUB_RUN_NUMBER}
            cp build/app/outputs/flutter-apk/app-release.apk build/dailylah.apk
            # App Bundle for Google Play, same version code and upload key.
            flutter build appbundle --release --build-number=${GITHUB_RUN_NUMBER} \
              --dart-define=APP_VERSION=$APP_VERSION --dart-define=GIT_SHA=${GITHUB_SHA::7} --dart-define=BUILD_NUMBER=${GITHUB_RUN_NUMBER}
            cp build/app/outputs/bundle/release/app-release.aab build/dailylah.aab
            # R8 map for this AAB: upload it in Play Console (App bundle explorer > Downloads >
            # ReTrace mapping file) so crash reports show real class names.
            cp build/app/outputs/mapping/release/mapping.txt build/dailylah-mapping.txt
            rm -f "$RUNNER_TEMP/upload.jks"
          else
            flutter build apk --debug --build-number=${GITHUB_RUN_NUMBER} \
              --dart-define=APP_VERSION=$APP_VERSION --dart-define=GIT_SHA=${GITHUB_SHA::7} --dart-define=BUILD_NUMBER=${GITHUB_RUN_NUMBER}
            cp build/app/outputs/flutter-apk/app-debug.apk build/dailylah.apk
          fi
      - name: Check Google Play target API (36 or higher)
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | tail -1)
          INFO=$("$AAPT" dump badging build/dailylah.apk)
          TARGET=$(echo "$INFO" | sed -n "s/^targetSdkVersion:'\([0-9]*\)'/\1/p")
          CODE=$(echo "$INFO" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          NAME=$(echo "$INFO" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          echo "targetSdk $TARGET, versionCode $CODE, versionName $NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Version::$NAME ($CODE), targetSdk $TARGET"
          if [ "$TARGET" -lt 36 ]; then
            echo "::error::targetSdk is $TARGET; Google Play needs 36 or higher for new apps and updates from 31 Aug 2026."
            exit 1
          fi
      - name: Upload APK for testing on a phone
        uses: actions/upload-artifact@v7
        with:
          name: dailylah-apk
          path: app/build/dailylah.apk
          retention-days: 14
      - name: Upload App Bundle for Google Play
        if: hashFiles('app/build/dailylah.aab') != ''
        uses: actions/upload-artifact@v7
        with:
          name: dailylah-aab
          path: |
            app/build/dailylah.aab
            app/build/dailylah-mapping.txt
          retention-days: 30
      - name: Check before uploading to Google Play
        # Fail loudly instead of skipping: a picked track must end in an upload.
        if: env.PLAY_TRACK != 'none'
        working-directory: .
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] \
            || { echo "::error::Upload to Google Play only from main (this run is on $GITHUB_REF)."; exit 1; }
          [ -f app/build/dailylah.aab ] \
            || { echo "::error::No signed AAB: the ANDROID_KEYSTORE_* secrets are missing."; exit 1; }
          [ -n "$PLAY_JSON" ] \
            || { echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON is not set."; exit 1; }
          # Release notes: one whatsnew-<locale> file per store language, max 500 characters.
          ls docs/store/whatsnew/whatsnew-* >/dev/null \
            || { echo "::error::No release notes in docs/store/whatsnew/."; exit 1; }
          for f in docs/store/whatsnew/whatsnew-*; do
            n=$(python3 -c "import sys; print(len(open(sys.argv[1], encoding='utf-8').read().strip()))" "$f")
            [ "$n" -le 500 ] || { echo "::error file=$f::Release notes are $n characters; Google Play allows 500."; exit 1; }
            echo "::notice title=Release notes ($(basename "$f"))::$(tr '\n' ' ' < "$f")"
          done
      - name: Upload to Google Play
        # Automatic on push to main (alpha = closed testing); manual runs can pick another track.
        # Production goes up as a draft to review and roll out in Play Console.
        if: env.PLAY_TRACK != 'none'
        # Pinned to v1.1.5 by commit: this step holds the Play service account key.
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.tursinalabs.dailylah
          releaseFiles: app/build/dailylah.aab
          mappingFile: app/build/dailylah-mapping.txt
          whatsNewDirectory: docs/store/whatsnew
          tracks: ${{ env.PLAY_TRACK }}
          status: ${{ env.PLAY_TRACK == 'production' && 'draft' || 'completed' }}
