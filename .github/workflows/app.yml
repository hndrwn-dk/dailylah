name: app
on:
  push:
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**"]
jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - name: Check app id is com.tursinalabs.dailylah
        working-directory: .
        run: ./scripts/check-app-id.sh
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Build debug APK (compiles Kotlin, manifest and plugins)
        run: flutter build apk --debug --dart-define=APP_VERSION=0.1.0-${GITHUB_SHA::7}
      - name: Upload APK for testing on a phone
        uses: actions/upload-artifact@v7
        with:
          name: dailylah-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
