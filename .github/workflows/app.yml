name: app
on:
  push:
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**"]
jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - name: Check app id is com.tursinalabs.dailylah
        working-directory: .
        run: ./scripts/check-app-id.sh
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: flutter analyze
        # Issues are also emitted as annotations so they show up on the commit.
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings --format=machine 2>&1 \
            | awk -F'|' 'NF>=8 {printf "::error file=app/%s,line=%s,col=%s::%s %s: %s\n", substr($4, index($4, "/lib/") ? index($4, "/lib/")+1 : index($4, "/test/")+1), $5, $6, $1, $3, $8}' || true
          flutter analyze
      - name: flutter test
        run: |
          set -o pipefail
          flutter test --reporter=expanded 2>&1 | tee test.log || {
            grep -E "^\s*(Expected|Actual|Which|══|Error|.*\.dart [0-9]+:[0-9]+)" test.log | head -40 \
              | sed 's/^/::error::/' ; exit 1; }
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Build debug APK (compiles Kotlin, manifest and plugins)
        run: flutter build apk --debug --dart-define=APP_VERSION=0.2.0-${GITHUB_SHA::7}
      - name: Upload APK for testing on a phone
        uses: actions/upload-artifact@v7
        with:
          name: dailylah-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
