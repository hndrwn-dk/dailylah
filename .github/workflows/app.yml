name: app
on:
  push:
    paths: ["app/**", "contracts/**", ".github/workflows/app.yml"]
  pull_request:
  workflow_dispatch:
    inputs:
      play_track:
        description: "Upload the signed AAB to this Google Play track (none = analyze and tests only; manual = sign, tag and keep it in a draft GitHub Release, no upload)"
        type: choice
        # Same default as a version bump without PLAY_PUSH_TRACK: nothing goes to Google Play
        # unless a track is picked.
        default: manual
        options: [none, manual, internal, alpha, beta, production]
# Read-only by default; no job here writes to the repo. Google Play uses its own service account.
permissions:
  contents: read
jobs:
  # Pull requests run this workflow every time, so the "app result" check below always
  # reports and can be a required check in the main ruleset (docs/QA.md "Required checks").
  # On a push the path filter above decides; on a pull request, this job does.
  changes:
    name: what changed (app)
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      # The PR merge commit's first parent is the base branch, so two commits are enough.
      # --no-renames lists both paths of a moved file (a move out of a watched folder still counts).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: .github
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only --no-renames HEAD^1 HEAD)
            printf 'Changed files:\n%s\n' "$files"
            grep -qE '^(app/|contracts/|\.github/workflows/app\.yml$)' <<<"$files" || run=false
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  analyze:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      track: ${{ steps.track.outputs.track }}
      base_ref: ${{ steps.base.outputs.ref }}
    env:
      # A push to main is a release only when it bumps `version:` in pubspec.yaml (new feature or
      # bug fix). Where it goes is the repository variable PLAY_PUSH_TRACK: `alpha` uploads to
      # closed testing once the on-device tests pass (jobs e2e and play), and promote.yml later
      # moves that release to production; unset or `manual` signs,
      # tags and keeps the AAB in a draft GitHub Release for an upload by hand, and never calls
      # Google Play (docs/QA.md "Manual releases"). A manual run picks its track. Pull requests
      # and other branches only build.
      PLAY_TRACK: ${{ github.event_name == 'workflow_dispatch' && inputs.play_track || (github.event_name == 'push' && github.ref == 'refs/heads/main' && (vars.PLAY_PUSH_TRACK || 'manual')) || 'none' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: track
        name: Release or build only?
        working-directory: .
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          track="$PLAY_TRACK"
          case "$track" in
            none|manual|internal|alpha|beta|production) ;;
            *) echo "::error::Unknown track '$track' (repository variable PLAY_PUSH_TRACK: manual, internal, alpha, beta or production)."; exit 1 ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$track" != none ]; then
            ver() { sed -n 's/^version:[[:space:]]*\([^[:space:]]*\).*/\1/p'; }
            new=$(ver < app/pubspec.yaml)
            old=$(git show "$BEFORE:app/pubspec.yaml" 2>/dev/null | ver || true)
            if [ "$new" = "$old" ]; then
              echo "::notice title=No release::version $new unchanged; analyze and tests only, nothing built or sent to Google Play."
              track=none
            elif [ -z "$(git diff --name-only "$BEFORE" HEAD -- docs/store/whatsnew)" ]; then
              echo "::error file=docs/store/whatsnew/whatsnew-en-US::version $old -> $new but the release notes were not changed. Write what is new in $new only."
              exit 1
            elif [ "$track" = manual ]; then
              echo "::notice title=Release (manual upload)::$old -> $new is signed, tagged and kept in a draft GitHub Release after the on-device tests; nothing is sent to Google Play."
            else
              echo "::notice title=Release::$old -> $new goes to $track after the on-device tests."
            fi
          fi
          echo "track=$track" >> "$GITHUB_OUTPUT"
      - id: base
        name: Previous release for the upgrade test
        # Users upgrade from the last version that reached Google Play, not from the commit before
        # this one (that may never have shipped). Release tags v<versionName> are made by the
        # release-tag job below; fetch-depth: 0 above brings them. HEAD^ so a manual run on a tagged
        # commit compares with the release before it, not with itself. Runs on every push and PR so
        # the lookup shows in the log; only a release uses the result.
        working-directory: .
        env:
          BEFORE: ${{ github.event.before }}
          TRACK: ${{ steps.track.outputs.track }}
        run: |
          echo "Release tags fetched: $(git tag -l 'v[0-9]*' | wc -l) ($(git tag -l 'v[0-9]*' --sort=-creatordate | head -3 | tr '\n' ' '))"
          if ref=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null); then
            echo "::notice title=Upgrade test::from $ref ($(git rev-parse --short "$ref^{commit}")), the last release"
          else
            if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$BEFORE" ]; then ref=$BEFORE; else ref=HEAD~1; fi
            if [ "$TRACK" != none ]; then
              echo "::warning title=No release tag::No v* tag below this commit: the upgrade test runs from $ref, which may never have shipped. Create the tag of the last release (docs/QA.md, Release tags)."
            else
              echo "No v* tag below this commit; a release from here would test the upgrade from $ref."
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Check app id is com.tursinalabs.dailylah
        working-directory: .
        run: ./scripts/check-app-id.sh
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # Pinned: a new stable release must not change CI by itself (CLAUDE.md, "CI security").
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: flutter analyze
        # Issues are also emitted as annotations so they show up on the commit.
        run: |
          set -o pipefail
          dart analyze --format=machine 2>&1 \
            | awk -F'|' 'NF>=8 {printf "::error file=app/%s,line=%s,col=%s::%s %s: %s\n", substr($4, index($4, "/lib/") ? index($4, "/lib/")+1 : index($4, "/test/")+1), $5, $6, $1, $3, $8}' || true
          flutter analyze
      - name: flutter test
        env:
          # Golden tests (test/golden_test.dart) run on this Linux runner only.
          GOLDENS: "1"
        run: |
          set -o pipefail
          flutter test --reporter=expanded --file-reporter=json:test.json 2>&1 | tee test.log || {
            # One annotation listing every failed test with its first error line.
            python3 ../scripts/test_failures.py test.json ; exit 1; }
      # Expected, actual and diff images of failed golden tests (docs/QA.md, "Golden tests").
      - name: Keep golden test failures
        if: failure() && hashFiles('app/test/failures/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-failures
          path: app/test/failures
          retention-days: 14
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.track.outputs.track != 'none'
        with:
          distribution: temurin
          java-version: "17"
      - name: Build App Bundle for Google Play (unsigned)
        # Only for a release (version bump on main, or a manual run with a track). Pull requests
        # and other pushes stop after analyze and tests; the emulator workflow builds and runs
        # the debug and release APKs on every pull request. No signing secrets here: Gradle
        # plugins and pub packages run in this step, so it builds the AAB unsigned and the `sign`
        # job signs it (docs/QA.md "Release signing").
        if: steps.track.outputs.track != 'none'
        env:
          DAILYLAH_UNSIGNED_RELEASE: "1"
        run: |
          # On failure, put the end of the build output on the commit page (job logs are long).
          exec > >(tee "$RUNNER_TEMP/build.log") 2>&1
          trap 'sleep 2; echo "::error title=Build failed::$(grep -v "^\s*$" "$RUNNER_TEMP/build.log" | tail -25 | sed "s/%/%25/g" | sed ":a;N;\$!ba;s/\n/%0A/g")"' ERR
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::warning title=Not on main::Signing and upload run only on main; this run builds and tests the unsigned App Bundle."
          fi
          # versionName from pubspec.yaml (one place to bump); versionCode is the run number.
          APP_VERSION=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)
          flutter build appbundle --release --build-number=${GITHUB_RUN_NUMBER} \
            --dart-define=APP_VERSION=$APP_VERSION --dart-define=GIT_SHA=${GITHUB_SHA::7} --dart-define=BUILD_NUMBER=${GITHUB_RUN_NUMBER}
          cp build/app/outputs/bundle/release/app-release.aab build/dailylah.aab
          # R8 map for this AAB, sent to Play with it so crash reports show real class names.
          cp build/app/outputs/mapping/release/mapping.txt build/dailylah-mapping.txt
          echo "::notice title=Version::$APP_VERSION (${GITHUB_RUN_NUMBER})"
          echo "Release $APP_VERSION, versionCode ${GITHUB_RUN_NUMBER} (unsigned build)" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the unsigned App Bundle and its R8 mapping
        if: hashFiles('app/build/dailylah.aab') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dailylah-aab-unsigned
          path: |
            app/build/dailylah.aab
            app/build/dailylah-mapping.txt
          retention-days: 30

  # The upload key lives only in environment "signing" (main only) and only this job reads it.
  # It checks out nothing but scripts/sign_aab.sh and runs no Gradle, pub or cache: only the
  # JDK's jarsigner and keytool. The signed AAB and the same R8 mapping become `dailylah-aab`,
  # which e2e, play and release-tag use. This guards the key, not what is inside the AAB.
  sign:
    name: sign the App Bundle
    needs: analyze
    if: needs.analyze.outputs.track != 'none' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/sign_aab.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dailylah-aab-unsigned
          path: unsigned
      - name: Sign with the upload key and check its certificate
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_SHA256: ${{ vars.UPLOAD_CERT_SHA256 }}
        run: |
          bash scripts/sign_aab.sh unsigned/dailylah.aab signed/dailylah.aab
          cp unsigned/dailylah-mapping.txt signed/dailylah-mapping.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dailylah-aab
          path: |
            signed/dailylah.aab
            signed/dailylah-mapping.txt
          retention-days: 30

  # The same commit must pass the on-device tests (app flows on API 29/35/36, upgrade over
  # the last release, the R8 release build, Maestro on this AAB) before anything goes to Google Play.
  # On main they test the signed AAB that is uploaded; a manual run on another branch (sign skipped)
  # tests the unsigned one. A failed sign stops here.
  e2e:
    name: on-device tests
    needs: [analyze, sign]
    if: ${{ !failure() && !cancelled() && needs.analyze.result == 'success' && needs.analyze.outputs.track != 'none' }}
    uses: ./.github/workflows/emulator.yml
    with:
      base_ref: ${{ needs.analyze.outputs.base_ref }}
      # The Maestro job tests the APK made from this very App Bundle.
      aab_artifact: ${{ needs.sign.result == 'success' && 'dailylah-aab' || 'dailylah-aab-unsigned' }}

  play:
    name: upload to Google Play (${{ needs.analyze.outputs.track }})
    # Only a signed AAB, only after the on-device tests. The Play key lives in environment "play"
    # (or "play-production", which waits for the owner's approval).
    needs: [analyze, sign, e2e]
    # Track `manual` never reaches this job, so the Play key is not read at all.
    if: needs.analyze.outputs.track != 'none' && needs.analyze.outputs.track != 'manual' && needs.sign.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ needs.analyze.outputs.track == 'production' && 'play-production' || 'play' }}
    # One upload at a time; a second release waits instead of cancelling the first.
    concurrency:
      group: play-upload
      cancel-in-progress: false
    env:
      PLAY_TRACK: ${{ needs.analyze.outputs.track }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # The signed AAB and its mapping from the sign job; the next step fails loudly if missing.
        continue-on-error: true
        with:
          name: dailylah-aab
          path: app/build
      - name: Check before uploading to Google Play
        # Fail loudly instead of skipping: a picked track must end in an upload.
        working-directory: .
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] \
            || { echo "::error::Upload to Google Play only from main (this run is on $GITHUB_REF)."; exit 1; }
          [ -f app/build/dailylah.aab ] \
            || { echo "::error::No signed AAB from the sign job."; exit 1; }
          [ -n "$PLAY_JSON" ] \
            || { echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON is not set."; exit 1; }
          # Release notes: one whatsnew-<locale> file per store language, max 500 characters.
          ls docs/store/whatsnew/whatsnew-* >/dev/null \
            || { echo "::error::No release notes in docs/store/whatsnew/."; exit 1; }
          for f in docs/store/whatsnew/whatsnew-*; do
            n=$(python3 -c "import sys; print(len(open(sys.argv[1], encoding='utf-8').read().strip()))" "$f")
            [ "$n" -le 500 ] || { echo "::error file=$f::Release notes are $n characters; Google Play allows 500."; exit 1; }
            echo "::notice title=Release notes ($(basename "$f"))::$(tr '\n' ' ' < "$f")"
          done
      - name: Upload to Google Play
        # Closed testing (alpha) on push to main; manual runs can pick another track.
        # Production releases normally go through promote.yml (the alpha release, no new upload);
        # picking `production` here uploads a draft to review and roll out in Play Console.
        # Pinned to v1.1.5 by commit: this step holds the Play service account key.
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.tursinalabs.dailylah
          releaseFiles: app/build/dailylah.aab
          mappingFile: app/build/dailylah-mapping.txt
          whatsNewDirectory: docs/store/whatsnew
          tracks: ${{ env.PLAY_TRACK }}
          status: ${{ env.PLAY_TRACK == 'production' && 'draft' || 'completed' }}

  # After a successful upload, or after sign and e2e for track `manual` (no upload): tag the
  # commit v<versionName> (the base of the next release's upgrade test) and keep the AAB, R8
  # mapping and release notes in a draft GitHub Release (the run artifact expires after 30 days).
  # Every track gets one: a closed-testing release is later promoted to production as it is
  # (promote.yml), so each production version has its files. The only job here that writes to
  # the repo; the token goes only to the steps that need it.
  release-tag:
    name: tag the release
    needs: [analyze, sign, e2e, play]
    if: >-
      ${{ !failure() && !cancelled() && needs.analyze.outputs.track != 'none'
      && needs.sign.result == 'success' && needs.e2e.result == 'success'
      && (needs.play.result == 'success' || (needs.analyze.outputs.track == 'manual' && needs.play.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PLAY_TRACK: ${{ needs.analyze.outputs.track }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tag
        name: Tag v<versionName>
        env:
          TOKEN: ${{ github.token }}
        run: |
          ver=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' app/pubspec.yaml)
          tag="v$ver"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if at=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
            if [ "$at" = "$GITHUB_SHA" ]; then
              echo "$tag is already on this commit."
            else
              echo "::warning title=Tag not moved::$tag already points to ${at::7}; this upload (${GITHUB_SHA::7}) is not tagged. Bump version: for a new release."
              echo "moved=no" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$tag"
          echo "::notice title=Release tag::$tag on ${GITHUB_SHA::7}"
          echo "- Tagged $tag on ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.tag.outputs.moved != 'no'
        with:
          name: dailylah-aab
          path: app/build
      - name: Draft GitHub Release with the AAB, mapping and release notes
        if: steps.tag.outputs.moved != 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          notes=docs/store/whatsnew/whatsnew-en-US
          n=$(python3 -c "import sys; print(len(open(sys.argv[1], encoding='utf-8').read().strip()))" "$notes")
          [ "$n" -le 500 ] || { echo "::error file=$notes::Release notes are $n characters; Google Play allows 500."; exit 1; }
          cp "$notes" app/build/whatsnew-en-US
          files=(app/build/dailylah.aab app/build/dailylah-mapping.txt app/build/whatsnew-en-US)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --draft --verify-tag --title "DailyLah ${TAG#v}" --notes-file "$notes"
          fi
          echo "- Draft release $TAG with dailylah.aab, dailylah-mapping.txt and whatsnew-en-US" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PLAY_TRACK" = manual ]; then
            echo "::notice title=Manual upload::Nothing was sent to Google Play. Upload dailylah.aab from the draft release $TAG in Play Console, with dailylah-mapping.txt (App bundle explorer > ReTrace mapping file) and whatsnew-en-US as the release notes."
          fi
      # The same three files as a run artifact (30 days), next to `dailylah-aab`.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PLAY_TRACK == 'manual' && steps.tag.outputs.moved != 'no'
        with:
          name: dailylah-release
          path: |
            app/build/dailylah.aab
            app/build/dailylah-mapping.txt
            app/build/whatsnew-en-US
          retention-days: 30

  # The one check to require for this workflow: fails if any job failed or was cancelled,
  # passes when they passed or were skipped (no app change).
  result:
    name: app result
    needs: [changes, analyze, sign, e2e, play, release-tag]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "::error::A job in the app workflow failed or was cancelled."; exit 1 ;;
          esac
