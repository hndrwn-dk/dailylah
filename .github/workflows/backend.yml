name: backend
on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Includes the bandit rules (S); exceptions are listed with a reason in pyproject.toml.
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      # Known vulnerabilities in the installed dependency tree (direct and transitive) from
      # PyPI advisories and OSV. Fails on any; a deliberate exception needs `--ignore-vuln ID`
      # here with a comment saying why.
      - name: pip-audit
        run: pip-audit -r requirements.txt --strict --progress-spinner off
