name: web
on:
  push:
    paths: ["web/**", "!web/data/**", ".github/workflows/web.yml"]
  pull_request:
permissions:
  contents: read
jobs:
  # Pull requests run this workflow every time, so the "web result" check below always reports
  # and can be a required check in the main ruleset (docs/QA.md "Required checks").
  # On a push the path filter above decides; on a pull request, this job does.
  changes:
    name: what changed (web)
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      # The PR merge commit's first parent is the base branch, so two commits are enough.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: .github
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only --no-renames HEAD^1 HEAD)
            printf 'Changed files:\n%s\n' "$files"
            grep -vE '^web/data/' <<<"$files" | grep -qE '^(web/|\.github/workflows/web\.yml$)' || run=false
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  test:
    name: page logic (node --test)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 22: ES module detection for web/**/*.js and globs in --test. No packages are installed.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - run: node --test 'web/tests/*.test.mjs'

  # The pages at phone width in a real browser: buttons and the links beside them never overlap.
  # Only playwright-core (pinned, lockfile, no install scripts); the browser is the runner's Chrome.
  layout:
    name: layout (Playwright)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - working-directory: web/tests/e2e
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test layout.e2e.mjs

  # The one check to require for this workflow: fails if any job failed or was cancelled,
  # passes when they passed or were skipped (no web change).
  result:
    name: web result
    needs: [changes, test, layout]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "::error::A job in the web workflow failed or was cancelled."; exit 1 ;;
          esac
