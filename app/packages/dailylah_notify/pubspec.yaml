name: dailylah_notify
description: Posts DailyLah's alert notifications with the sticker layout (pills and a small picture). Android only.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.tursinalabs.dailylah.notify
        pluginClass: DailylahNotifyPlugin
