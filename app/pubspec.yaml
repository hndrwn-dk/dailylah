name: dailylah
description: DailyLah — know before you go lah.
publish_to: "none"
version: 1.0.4+6

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.7.0
  shared_preferences: ^2.5.6
  geolocator: ^14.1.1
  workmanager: ^0.10.10
  flutter_local_notifications: ^22.3.2
  home_widget: ^0.10.0
  path_provider: ^2.1.6
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/wordmark.png
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
