# Today shows the commute trip for the saved home and live bus arrivals at its stop; a bus
# opens "Where's my bus?". Late at night the board says buses have stopped, which also passes.
# On a public holiday (holidays.json) there is no trip: Today shows the holiday banner instead,
# which passes too, so the flow holds on any day.
appId: com.tursinalabs.dailylah
name: 03 Today bus arrivals
---
- launchApp:
    stopApp: true
    permissions:
      notifications: deny
- startRecording: 03_today_bus
- tapOn: "(?s)Today.*"
# The trip card, or the public holiday banner that replaces it (near the top of Today).
- scrollUntilVisible:
    element: "(?s).*(Buses (to|from) |public holiday, no work or school trip today).*"
    direction: DOWN
    timeout: 30000
    centerElement: true
- runFlow:
    when:
      visible: "(?s).*public holiday, no work or school trip today.*"
    commands:
      - assertNotVisible: "(?s).*Buses (to|from) .*"
- runFlow:
    when:
      notVisible: "(?s).*public holiday, no work or school trip today.*"
    commands:
      - scrollUntilVisible:
          element: "(?s).*Buses (to|from) .*"
          direction: DOWN
          timeout: 30000
          centerElement: true
      # Arrivals come from the API on Render (LTA DataMall); wait for an answer, not the spinner. A bus
      # row ("88 / Arr / then 7 min") counts too: the board can push its hint below the screen. So does
      # the card on top of it ("Leave in 12 min to catch 88"), which can push the whole board below.
      - extendedWaitUntil:
          visible: "(?s)(.*(Tap a bus to see where it is|No direct bus|No buses right now|Buses have stopped|Bus times not available|Leave (now|in \\d+ min) to catch).*|\\w+\\n(Arr|\\d+ min)\\n.*)"
          timeout: 90000
      - assertNotVisible: "(?s).*Bus times not available.*"
      # Bring the board on screen when the leave card pushed it down.
      - scrollUntilVisible:
          element: "(?s)(.*(Tap a bus to see where it is|No direct bus|No buses right now|Buses have stopped).*|\\w+\\n(Arr|\\d+ min)\\n.*)"
          direction: DOWN
          timeout: 15000
          optional: true
      - runFlow:
          when:
            visible: "(?s)\\w+\\n(Arr|\\d+ min)\\n.*"
          commands:
            # Centre the row first: at the bottom of the screen it sits under the floating tab bar,
            # and the tap would open the tab instead.
            - scrollUntilVisible:
                element: "(?s)\\w+\\n(Arr|\\d+ min)\\n.*"
                direction: DOWN
                centerElement: true
            - tapOn: "(?s)\\w+\\n(Arr|\\d+ min)\\n.*"
            - extendedWaitUntil:
                visible: "(?s).*Where's my bus\\?.*"
                timeout: 20000
            - back
- stopRecording
