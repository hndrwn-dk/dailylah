# Home tab: the saved HDB block (Blk 201 Ang Mo Kio Ave 3) and its sections, one at a time.
appId: com.tursinalabs.dailylah
name: 05 Home
---
- launchApp:
    stopApp: true
    permissions:
      notifications: deny
- startRecording: 05_home
- tapOn: "(?s)Home.*"
- extendedWaitUntil:
    visible: "(?is).*Ang Mo Kio Av.*3.*"
    timeout: 30000
- tapOn: "(?s)Emergency"
# The section chips are 48 dp tall, so on a small screen the call buttons start below the fold.
- scrollUntilVisible:
    element: "(?s).*995 Ambulance & fire.*"
    direction: DOWN
    timeout: 20000
# Back to the top (the block name above the chips), so every chip row is on screen again.
- scrollUntilVisible:
    element: "(?is).*Ang Mo Kio Av.*3.*"
    direction: UP
    timeout: 20000
- tapOn: "(?s)Meeting points"
- swipe:
    from: "(?s)Meeting points"
    direction: LEFT
- tapOn: "(?s)Schools"
- tapOn: "(?s)Health"
- swipe:
    from: "(?s)Health"
    direction: RIGHT
- tapOn: "(?s)My home"
- scrollUntilVisible:
    element: "(?is).*Ang Mo Kio Av.*3.*"
    direction: UP
    timeout: 20000
- stopRecording
