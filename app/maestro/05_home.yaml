# Home tab: the saved HDB block (Blk 201 Ang Mo Kio Ave 3) and its sections, one at a time.
appId: com.tursinalabs.dailylah
name: 05 Home
---
- launchApp:
    stopApp: true
    permissions:
      notifications: deny
- startRecording: 05_home
- tapOn: "(?s)Home.*"
- extendedWaitUntil:
    visible: "(?is).*Ang Mo Kio Av.*3.*"
    timeout: 30000
- tapOn: "(?s)Emergency"
- extendedWaitUntil:
    visible: "(?s).*995 Ambulance & fire.*"
    timeout: 20000
- tapOn: "(?s)Meeting points"
- swipe:
    from: "(?s)Meeting points"
    direction: LEFT
- tapOn: "(?s)Schools"
- tapOn: "(?s)Health"
- swipe:
    from: "(?s)Health"
    direction: RIGHT
- tapOn: "(?s)My home"
- assertVisible: "(?is).*Ang Mo Kio Av.*3.*"
- stopRecording
