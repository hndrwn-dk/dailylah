# Home tab: the saved HDB block (Blk 201 Ang Mo Kio Ave 3) and its sections, one at a time.
appId: com.tursinalabs.dailylah
name: 05 Home
---
- launchApp:
    stopApp: true
    permissions:
      notifications: deny
- startRecording: 05_home
- tapOn: "(?s)Home.*"
- extendedWaitUntil:
    visible: "(?is).*Ang Mo Kio Av.*3.*"
    timeout: 30000
- tapOn: "(?s)Safety"
# The call buttons come first; on a small screen they may start below the fold.
- scrollUntilVisible:
    element: "(?s).*995 Ambulance & fire.*"
    direction: DOWN
    timeout: 20000
# Back to the top (the block name above the tiles), so every tile is on screen again.
- scrollUntilVisible:
    element: "(?is).*Ang Mo Kio Av.*3.*"
    direction: UP
    timeout: 20000
- tapOn: "(?s)Schools"
- tapOn: "(?s)Health"
# Health opened without a crash: the app and its tabs are still there. What the section lists
# depends on live data near the block (dengue clusters, clinics), so nothing of it is asserted.
- extendedWaitUntil:
    visible: "(?is).*Ang Mo Kio Av.*3.*"
    timeout: 20000
- stopRecording
