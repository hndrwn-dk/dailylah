# Senior: the largest font size, location and notifications denied. Every tab opens, Plan a trip
# opens from Today, and About can be reached and read (docs/QA.md "Persona journeys").
# The texts are the same at any font size; what is checked here is that they can be reached.
appId: com.tursinalabs.dailylah
name: 12 Senior largest text
---
- launchApp:
    stopApp: true
    permissions:
      all: deny
- startRecording: 12_senior_large_text
- extendedWaitUntil:
    visible: "(?s)Today.*"
    timeout: 30000
- assertNotVisible: "(?s).*Welcome to.*"
- scrollUntilVisible:
    element: "(?s)Plan a trip.*"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "(?s)Plan a trip.*"
- extendedWaitUntil:
    visible: "Swap From and To"
    timeout: 20000
- back
- tapOn: "(?s)Nearby.*"
- extendedWaitUntil:
    visible: "(?s).*(Buses near here|Choose a place|Use your location to see buses).*"
    timeout: 20000
# Each tab shows its own content, not just the tab bar: the saved block, then History's first line.
- tapOn: "(?s)Home.*"
- extendedWaitUntil:
    visible: "(?s).*Ang Mo Kio Ave 3.*"
    timeout: 20000
- tapOn: "(?s)History.*"
- extendedWaitUntil:
    visible: "(?s).*(On this phone only|Learn my habits|Nothing yet).*"
    timeout: 20000
- tapOn: "(?s)More.*"
- scrollUntilVisible:
    element: "(?s)About DailyLah.*"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "(?s)About DailyLah.*"
- scrollUntilVisible:
    element: "(?s).*Privacy policy.*"
    direction: DOWN
    centerElement: true
    timeout: 60000
- stopRecording
